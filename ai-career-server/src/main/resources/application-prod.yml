spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:8}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: 3000
  mvc:
    async:
      request-timeout: ${AI_STREAM_TIMEOUT:180s}
  ai:
    openai:
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      timeout: ${AI_TIMEOUT}
      max-retries: ${AI_MAX_RETRIES}
      chat:
        model: ${AI_MODEL}
        temperature: ${AI_TEMPERATURE:0.4}

ai:
  tool-calling:
    career:
      enabled: ${AI_CAREER_TOOLS_ENABLED}
  rag:
    enabled: ${AI_RAG_ENABLED}
    import: ${AI_RAG_IMPORT}
    knowledge-directory: ${RAG_KNOWLEDGE_DIR}
    jdbc-url: ${RAG_PG_URL}
    username: ${RAG_PG_USERNAME}
    password: ${RAG_PG_PASSWORD}
    embedding-base-url: ${RAG_EMBEDDING_BASE_URL}
    embedding-api-key: ${RAG_EMBEDDING_API_KEY}
    embedding-model: ${RAG_EMBEDDING_MODEL}
    embedding-dimension: ${RAG_EMBEDDING_DIMENSION:1024}
    embedding-timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:15}
    embedding-max-retries: ${RAG_EMBEDDING_MAX_RETRIES:0}
    min-score: ${RAG_MIN_SCORE:0.55}
    pg-connect-timeout-seconds: ${RAG_PG_CONNECT_TIMEOUT_SECONDS:3}
    pg-socket-timeout-seconds: ${RAG_PG_SOCKET_TIMEOUT_SECONDS:5}
    pg-query-timeout-seconds: ${RAG_PG_QUERY_TIMEOUT_SECONDS:3}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-millis: ${JWT_EXPIRATION_MILLIS}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT}
    bucket-name: ${OSS_BUCKET_NAME}

server:
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    diskspace:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

logging:
  level:
    root: INFO
    com.xucheng.aicareer: INFO
    org.springframework.web: WARN
