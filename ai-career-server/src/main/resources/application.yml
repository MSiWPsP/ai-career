spring:
  application:
    name: ai-career-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mvc:
    async:
      request-timeout: ${AI_STREAM_TIMEOUT:120s}
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
  ai:
    model:
      chat: openai
      embedding: none
    openai:
      base-url: ${AI_BASE_URL:https://ws-o9lujwrkuwzjfx0k.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:not-configured}
      timeout: ${AI_TIMEOUT:60s}
      max-retries: ${AI_MAX_RETRIES:1}
      chat:
        model: ${AI_MODEL:qwen3.7-plus}
        temperature: ${AI_TEMPERATURE:0.4}

ai:
  rag:
    enabled: ${AI_RAG_ENABLED:false}
    import: ${AI_RAG_IMPORT:false}
    knowledge-directory: ${RAG_KNOWLEDGE_DIR:../docs/知识库}
    jdbc-url: ${RAG_PG_URL:jdbc:postgresql://127.0.0.1:5432/ai_career_rag}
    username: ${RAG_PG_USERNAME:postgres}
    password: ${RAG_PG_PASSWORD:}
    embedding-base-url: ${RAG_EMBEDDING_BASE_URL:${AI_BASE_URL:https://ws-o9lujwrkuwzjfx0k.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}}
    embedding-api-key: ${RAG_EMBEDDING_API_KEY:${AI_API_KEY:not-configured}}
    embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimension: 1024
    min-score: ${RAG_MIN_SCORE:0.55}

app:
  jwt:
    secret: ${JWT_SECRET:ai-career-dev-jwt-secret-key-change-in-production-2026}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:604800000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

aliyun:
  oss:
    endpoint: https://oss-cn-shanghai.aliyuncs.com
    bucket-name: xucheng-zzyl
