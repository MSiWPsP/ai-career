name: ${COMPOSE_PROJECT_NAME:-ai-career}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: ${DB_URL:?请在 .env 中配置 DB_URL}
  DB_USERNAME: ${DB_USERNAME:?请在 .env 中配置 DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
  DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-8}
  DB_MIN_IDLE: ${DB_MIN_IDLE:-1}
  AI_BASE_URL: ${AI_BASE_URL:?请在 .env 中配置 AI_BASE_URL}
  AI_API_KEY: ${AI_API_KEY:?请在 .env 中配置 AI_API_KEY}
  AI_MODEL: ${AI_MODEL:?请在 .env 中配置 AI_MODEL}
  AI_TIMEOUT: ${AI_TIMEOUT:-60s}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
  AI_STREAM_TIMEOUT: ${AI_STREAM_TIMEOUT:-180s}
  AI_CAREER_TOOLS_ENABLED: ${AI_CAREER_TOOLS_ENABLED:-true}
  AI_TOOL_MAX_CALLS_PER_TOOL: ${AI_TOOL_MAX_CALLS_PER_TOOL:-2}
  AI_RAG_ENABLED: ${AI_RAG_ENABLED:-true}
  AI_RAG_IMPORT: "false"
  RAG_KNOWLEDGE_DIR: /app/knowledge
  RAG_PG_URL: ${RAG_PG_URL:-jdbc:postgresql://pgvector:5432/ai_career_rag}
  RAG_PG_USERNAME: ${RAG_PG_USERNAME:?请在 .env 中配置 RAG_PG_USERNAME}
  RAG_PG_PASSWORD: ${RAG_PG_PASSWORD:?请在 .env 中配置 RAG_PG_PASSWORD}
  RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:?请在 .env 中配置 RAG_EMBEDDING_BASE_URL}
  RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:?请在 .env 中配置 RAG_EMBEDDING_API_KEY}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:?请在 .env 中配置 RAG_EMBEDDING_MODEL}
  RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1024}
  RAG_EMBEDDING_TIMEOUT_SECONDS: ${RAG_EMBEDDING_TIMEOUT_SECONDS:-15}
  RAG_EMBEDDING_MAX_RETRIES: ${RAG_EMBEDDING_MAX_RETRIES:-0}
  RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.55}
  RAG_PG_CONNECT_TIMEOUT_SECONDS: ${RAG_PG_CONNECT_TIMEOUT_SECONDS:-3}
  RAG_PG_SOCKET_TIMEOUT_SECONDS: ${RAG_PG_SOCKET_TIMEOUT_SECONDS:-5}
  RAG_PG_QUERY_TIMEOUT_SECONDS: ${RAG_PG_QUERY_TIMEOUT_SECONDS:-3}
  JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
  JWT_EXPIRATION_MILLIS: ${JWT_EXPIRATION_MILLIS:-604800000}
  OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-shanghai.aliyuncs.com}
  OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-xucheng-zzyl}
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请在 .env 中配置 OSS_ACCESS_KEY_ID}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请在 .env 中配置 OSS_ACCESS_KEY_SECRET}
  JAVA_TOOL_OPTIONS: >-
    -Xms128m -Xmx352m -XX:MaxMetaspaceSize=144m -XX:MaxDirectMemorySize=64m
    -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
  TZ: Asia/Shanghai

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_career}
      MYSQL_USER: ${DB_USERNAME:?请在 .env 中配置 DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=30
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --table-open-cache=400
      - --thread-cache-size=8
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    mem_limit: 448m
    mem_reservation: 256m
    cpus: 0.60
    pids_limit: 128
    logging: *default-logging
    networks:
      - app-network

  pgvector:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_career_rag}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - wal_buffers=8MB
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 384m
    mem_reservation: 256m
    cpus: 0.60
    pids_limit: 128
    logging: *default-logging
    networks:
      - app-network

  backend:
    image: ai-career-backend:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: ai-career-server/Dockerfile
      args:
        RUN_TESTS: ${DOCKER_RUN_TESTS:-false}
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 75s
    mem_limit: 640m
    mem_reservation: 384m
    cpus: 1.20
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - app-network

  web:
    image: ai-career-web:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: ai-career-web/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging
    networks:
      - app-network

  rag-import:
    image: ai-career-backend:${APP_VERSION:-local}
    profiles: ["tools"]
    restart: "no"
    environment:
      <<: *backend-environment
      AI_RAG_ENABLED: "true"
      AI_RAG_IMPORT: "true"
    command: ["--spring.main.web-application-type=none"]
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    mem_limit: 640m
    mem_reservation: 384m
    cpus: 1.20
    pids_limit: 256
    logging: *default-logging
    networks:
      - app-network

volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME:-ai-career}-mysql-data
  pgvector-data:
    name: ${COMPOSE_PROJECT_NAME:-ai-career}-pgvector-data

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-ai-career}-network
    driver: bridge
